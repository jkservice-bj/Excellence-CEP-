var D={EST:{"EST":{
"Circulation sanguine":{l:["Le <b>sang</b> contient : plasma, globules rouges (transportent l’oxygène), globules blancs (défendent le corps) et plaquettes (arrêtent les saignements).","Le <b>cœur</b> est une pompe musclée. Les <b>artères</b> emportent le sang du cœur vers les organes ; les <b>veines</b> le ramènent au cœur ; les <b>capillaires</b> sont de très fins vaisseaux.","La petite circulation va du cœur aux poumons et retour ; la grande circulation va du cœur à tout le corps.","On mesure le <b>pouls</b> au poignet ou au cou : environ 70 à 80 battements par minute chez l’adulte."],r:"Le cœur pompe le sang dans les artères ; les veines le ramènent ; le sang transporte l’oxygène et les nutriments.",q:[["Quels vaisseaux ramènent le sang au cœur ?",["Les artères","Les veines","Les capillaires"],1],["Que transportent les globules rouges ?",["L’oxygène","Les microbes","L’eau seulement"],0],["Où sent-on le pouls ?",["Au poignet","Au genou","À l’oreille"],0]]},
"Respiration":{l:["L’<b>appareil respiratoire</b> : fosses nasales → pharynx → larynx → trachée → bronches → poumons (alvéoles).","<b>Inspiration</b> : l’air entre, le thorax gonfle. <b>Expiration</b> : l’air sort, le thorax se dégonfle.","L’air inspiré est riche en oxygène ; l’air expiré est riche en gaz carbonique.","Hygiène : respirer par le nez, ne pas fumer, aérer les pièces, éviter la poussière."],r:"Nez → trachée → bronches → poumons : le sang prend l’oxygène et rejette le gaz carbonique.",q:[["Quel organe est le principal de la respiration ?",["Les poumons","L’estomac","Le foie"],0],["Quel gaz rejette-t-on en expirant ?",["Oxygène","Gaz carbonique","Azote seulement"],1],["Quel conduit mène l’air aux bronches ?",["L’œsophage","La trachée","L’intestin"],1]]},
"Circuit électrique":{l:["Un <b>circuit simple</b> : pile, fils, interrupteur, lampe. Il doit être <b>fermé</b> pour que la lampe s’allume.","<b>Conducteurs</b> : cuivre, fer, aluminium. <b>Isolants</b> : plastique, bois, caoutchouc, verre.","En <b>série</b>, les lampes sont à la suite : si une grille, tout s’éteint. En <b>dérivation</b>, chaque lampe a son propre chemin.","Dangers : ne jamais toucher un fil dénudé, une prise avec les mains mouillées ; le court-circuit peut causer un incendie."],r:"Circuit fermé = courant. Métaux conducteurs ; plastique et bois isolants.",q:[["Quel élément ferme ou ouvre le circuit ?",["La pile","L’interrupteur","La lampe"],1],["Lequel est un conducteur ?",["Le cuivre","Le bois","Le plastique"],0],["Si une lampe grille en série…",["Les autres restent allumées","Tout s’éteint","Rien ne change"],1]]},
"Machines simples":{l:["Une machine simple aide à faire un travail avec moins d’effort.","Le <b>levier</b> a un point d’appui, une force motrice (effort) et une résistance (charge). Exemples : brouette, pince, ciseaux, balançoire, décapsuleur.","La <b>poulie fixe</b> change la direction de la force (puits, drapeau). La <b>poulie mobile</b> diminue l’effort.","Autre machine simple : le plan incliné (rampe)."],r:"Le levier et la poulie facilitent le travail : soulever, tirer, déplacer.",q:[["La brouette est un exemple de…",["Levier","Pile","Circuit"],0],["La poulie fixe permet de…",["Changer la direction de la force","Voler","Chauffer"],0],["Le point où le levier s’appuie s’appelle…",["Point d’appui","Charge","Pouls"],0]]},
"Premiers hommes":{l:["Les premiers hommes sont <b>différents de nous</b> : front fuyant, arcades proéminentes, cerveau plus petit, corps plus velu.","Les principaux : Australopithèque, Homo habilis (premiers outils), Homo erectus (maîtrise du feu), puis Homo sapiens (l’homme actuel), apparu en Afrique.","Ils vivaient de chasse, de pêche et de cueillette, étaient nomades et habitaient grottes et abris.","Ils ont taillé la pierre, découvert le feu, fabriqué des outils et ensuite pratiqué l’agriculture."],r:"L’homme a évolué : outils, feu, puis agriculture. Homo sapiens, c’est nous.",q:[["Quel homme a maîtrisé le feu ?",["Homo erectus","Aucun","Un robot"],0],["Les premiers hommes vivaient de…",["Chasse et cueillette","Commerce","Usines"],0],["Nous sommes…",["Homo sapiens","Australopithèque","Homo habilis"],0]]},
"Énergies autour de nous":{l:["L’<b>énergie</b> permet de faire fonctionner machines, véhicules, lampes, et même notre corps.","Sources autour de nous : soleil, vent, eau, bois, charbon, pétrole, gaz, électricité.","Usages : s’éclairer, cuire, se déplacer, faire marcher les usines. Le soleil donne lumière et chaleur.","Il faut économiser l’énergie : éteindre les lampes inutiles, ne pas gaspiller le carburant."],r:"L’énergie nous éclaire, nous chauffe et fait avancer les machines ; il faut l’économiser.",q:[["Quelle source donne lumière et chaleur ?",["Le soleil","La lune","Le sable"],0],["Une source d’énergie est…",["Le pétrole","Le sable","La craie"],0],["Pour économiser l’énergie, on…",["Éteint les lampes inutiles","Laisse tout allumé","Gaspille"],0]]},
"Renouvelables ou non":{l:["<b>Énergies renouvelables</b> : ne s’épuisent pas ou se reconstituent : soleil, vent, eau (barrage), biomasse.","<b>Énergies non renouvelables</b> : pétrole, charbon, gaz naturel, uranium ; elles s’épuisent et polluent.","Au Bénin et au Togo, le barrage de Nangbéto sur le Mono produit de l’électricité grâce à l’eau.","Les énergies renouvelables protègent l’environnement : panneaux solaires, éoliennes."],r:"Renouvelables : soleil, vent, eau. Non renouvelables : pétrole, charbon, gaz.",q:[["Quelle énergie est renouvelable ?",["Solaire","Pétrole","Charbon"],0],["Quelle énergie est non renouvelable ?",["Éolienne","Gaz naturel","Hydraulique"],1],["Que produit un barrage ?",["De l’électricité","Du pétrole","Du charbon"],0]]}}},
ES:{"Histoire":{
"Colonisation et résistances":{l:["La <b>Conférence de Berlin</b> (1884-1885) fixe les règles du partage de l’Afrique entre puissances européennes.","Causes de la colonisation : matières premières, marchés, puissance politique, prétexte « civilisateur ».","La France conquiert par traités puis par la force. Le Dahomey devient colonie française en 1894 et est intégré à l’Afrique-Occidentale française (AOF).","<b>Résistances</b> : Béhanzin (Dahomey), Samory Touré (Soudan), Bio Guéra (Nikki). Les colonisés refusent la soumission, mais sont vaincus par la supériorité militaire."],r:"Berlin 1884-85 : partage de l’Afrique. 1894 : défaite de Béhanzin, le Dahomey devient colonie française.",q:[["Quelle conférence a organisé le partage de l’Afrique ?",["Berlin","Paris","Londres"],0],["Quel roi du Dahomey a résisté à la France ?",["Béhanzin","Toffa","Agadja"],0],["En quelle année le Dahomey devient-il colonie ?",["1894","1960","1958"],0]]},
"Loi-cadre, référendum, indépendance":{l:["La <b>loi-cadre de 1956</b> (Gaston Defferre) donne plus d’autonomie aux colonies : conseils de gouvernement, suffrage universel.","Le <b>référendum du 28 septembre 1958</b> propose la Communauté française : le Dahomey vote « oui » (la Guinée vote « non »).","Le Dahomey devient une République autonome le 4 décembre 1958.","L’<b>indépendance</b> est proclamée le <b>1er août 1960</b>. Premier président : Hubert Maga."],r:"1956 : loi-cadre. 1958 : référendum. 1er août 1960 : indépendance.",q:[["Quelle loi accorde l’autonomie interne en 1956 ?",["La loi-cadre","La loi de 1960","La Constitution"],0],["Quelle date est celle de l’indépendance ?",["1er août 1960","28 sept. 1958","4 déc. 1958"],0],["Quel pays a dit « non » au référendum de 1958 ?",["La Guinée","Le Dahomey","Le Togo"],0]]},
"Organisations internationales":{l:["<b>ONU</b> (Organisation des Nations unies) : maintient la paix et aide au développement. Le Dahomey y est admis le 20 septembre 1960.","<b>UA</b> (Union africaine) : unité et développement de l’Afrique ; elle remplace l’OUA en 2002.","<b>UMOA</b> (Union monétaire ouest-africaine, 1962) : monnaie commune, le franc CFA, émis par la BCEAO ; elle fait partie de l’UEMOA.","Le Bénin participe à ces organisations pour la paix, la coopération et le développement."],r:"ONU : paix mondiale. UA : unité africaine. UMOA : monnaie commune (franc CFA).",q:[["Quelle organisation vise la paix mondiale ?",["ONU","UMOA","UA"],0],["Quelle monnaie utilise l’UMOA ?",["Franc CFA","Euro","Dollar"],0],["UA signifie…",["Union africaine","Union atlantique","Union asiatique"],0]]}},
"Géographie":{
"Situation du Bénin":{l:["Le Bénin est en <b>Afrique de l’Ouest</b>, au nord de l’équateur, entre le Togo à l’ouest et le Nigeria à l’est.","Au nord : le Burkina Faso et le Niger. Au sud : l’océan Atlantique (golfe de Guinée), sur environ 125 km de côte.","Superficie : environ 114 763 km². Forme allongée du sud au nord.","Dans le monde : sur le continent africain ; en Afrique : pays côtier d’Afrique de l’Ouest, porte d’entrée pour les pays sans accès à la mer (Niger, Burkina Faso, Mali)."],r:"Bénin : Afrique de l’Ouest, 4 voisins, 125 km de côte sur l’Atlantique.",q:[["Quel océan borde le Bénin ?",["Atlantique","Indien","Pacifique"],0],["Quel pays est à l’ouest ?",["Togo","Nigeria","Niger"],0],["Le Bénin est un pays d’…",["Afrique de l’Ouest","Afrique du Nord","Asie"],0]]},
"Aspects physiques":{l:["<b>Sud</b> : plaines et plateaux de terre de barre, lagunes, climat subéquatorial (2 saisons des pluies, 2 saisons sèches), forêts et cocotiers.","<b>Centre</b> : collines et plateaux, climat de transition, savane arborée.","<b>Nord</b> : chaîne de l’Atacora (relief le plus élevé), plaines du Borgou, climat soudanien (1 saison des pluies, 1 saison sèche avec l’harmattan), savane.","Le Bénin est un pays surtout de plaines et de bas plateaux."],r:"Sud : 4 saisons, lagunes. Nord : 2 saisons, Atacora, savane.",q:[["Où se trouve la chaîne de l’Atacora ?",["Au nord","Au sud","À l’est"],0],["Le climat du sud est…",["Subéquatorial","Soudanien","Désertique"],0],["Quel vent sec souffle au nord ?",["L’harmattan","La mousson","Le typhon"],0]]},
"Hydrographie":{l:["<b>Ouémé</b> : le plus long fleuve du Bénin, il se jette dans la lagune de Porto-Novo.","<b>Mono</b> : fleuve frontière avec le Togo ; barrage de Nangbéto.","Au nord : le <b>Niger</b> (frontière avec le Niger) et ses affluents Mékrou, Alibori, Sota ; la Pendjari coule vers le Burkina Faso.","Lacs et lagunes du sud : lac Nokoué, lac Ahémé, lagunes de Porto-Novo et de Grand-Popo."],r:"Ouémé et Mono au sud, Niger et affluents au nord, Nokoué et Ahémé : lacs du sud.",q:[["Quel est le plus long fleuve du Bénin ?",["Ouémé","Mono","Pendjari"],0],["Quel fleuve sépare le Bénin du Togo ?",["Mono","Niger","Ouémé"],0],["Quel lac se trouve près de Cotonou ?",["Nokoué","Tchad","Victoria"],0]]},
"Peuplement et habitat":{l:["Le Bénin compte plus de 12 millions d’habitants, plus nombreux au sud.","Principales ethnies : Fon, Adja, Yoruba, Bariba, Dendi, Peulh, Otamari (Somba).","Habitat du sud : maisons en dur ; habitat lacustre à Ganvié sur le lac Nokoué.","Habitat du nord : cases en banco et « tata » des Otamari (Atacora) ; les Peulhs ont des huttes d’éleveurs."],r:"Population surtout au sud ; habitat adapté au milieu : lacustre, tata, case.",q:[["Quel village est lacustre ?",["Ganvié","Natitingou","Kandi"],0],["Où la population est-elle la plus dense ?",["Au sud","Au nord","Dans l’Atacora"],0],["Le tata est un habitat…",["Du nord","Du sud","Lacustre"],0]]},
"Voies de communication":{l:["<b>Routes</b> : routes bitumées (la grande route Cotonou – Malanville au nord), routes en terre et pistes rurales.","<b>Chemin de fer</b> : ligne Cotonou – Parakou. <b>Port</b> de Cotonou, important pour le Niger, le Burkina Faso et le Mali.","<b>Aéroport</b> international de Cotonou. Télécommunications : téléphone, internet, radios.","Les voies de communication facilitent les échanges, le commerce et le déplacement des personnes."],r:"Routes, rail, port et aéroport relient le Bénin à ses voisins et au monde.",q:[["Quelle ville a le grand port ?",["Cotonou","Kandi","Dassa"],0],["Le chemin de fer relie Cotonou à…",["Parakou","Lomé","Niamey"],0],["Les routes servent à…",["Échanger et se déplacer","Dormir","Cultiver"],0]]},
"Agriculture et élevage":{l:["<b>Sud</b> : palmier à huile, cocotier, maïs, manioc. <b>Centre</b> : igname, manioc, anacardier. <b>Nord</b> : coton, sorgho, mil, riz.","Le <b>coton</b> est le premier produit agricole d’exportation.","<b>Élevage</b> : bovins, ovins, caprins surtout au nord (Peulhs) ; volaille et porcs au sud. <b>Pêche</b> : lagunes, lacs et océan.","Les cultures dépendent du climat et du sol de chaque région."],r:"Sud : palmier. Centre : igname. Nord : coton, bétail.",q:[["Quel produit est le plus exporté ?",["Le coton","Le riz","Le mil"],0],["Où élève-t-on surtout les bovins ?",["Au nord","Au sud","En mer"],0],["Le palmier à huile pousse surtout…",["Au sud","Au nord","Au désert"],0]]},
"Mines et activités":{l:["<b>Ressources minières</b> : calcaire (ciment), marbre, or, fer, phosphate, sable ; pétrole offshore de Sèmè (exploitation arrêtée).","Au <b>sud</b> : commerce, port, pêche, artisanat, tourisme. Au <b>centre</b> : agriculture et transformation. Au <b>nord</b> : coton, élevage, parcs (Pendjari, W).","Les artisans, les commerçants et l’industrie participent à l’économie.","Le tourisme : Ganvié, Ouidah, parcs nationaux."],r:"Mines : calcaire, marbre, or. Chaque région a ses activités propres.",q:[["Quelle ressource sert à fabriquer le ciment ?",["Le calcaire","L’or","Le sable"],0],["Où se trouve le port ?",["Au sud","Au nord","Au centre"],0],["Le parc de la Pendjari est…",["Au nord","Au sud","Au centre"],0]]}},
"Civisme":{
"Code de la route":{l:["Le <b>code de la route</b> fixe les règles pour la sécurité de tous : piétons, cyclistes, motocyclistes, automobilistes.","Feu rouge : on s’arrête. Feu orange : on se prépare à s’arrêter. Feu vert : on passe avec prudence.","Piétons : traverser sur les passages cloutés, marcher sur le trottoir ou à gauche de la route.","Motos : casque obligatoire ; ne pas dépasser la vitesse. Ne jamais conduire après avoir bu ou sans permis."],r:"Respecter le code de la route, c’est protéger sa vie et celle des autres.",q:[["Que signifie le feu rouge ?",["Arrêt","Passage","Vitesse"],0],["Que doit porter le motocycliste ?",["Un casque","Un bonnet","Rien"],0],["Où doit traverser le piéton ?",["Sur le passage clouté","N’importe où","Sur l’autoroute"],0]]},
"Instances locales":{l:["La <b>commune</b> est dirigée par le maire et le conseil communal.","L’<b>arrondissement</b> est dirigé par le chef d’arrondissement et le conseil d’arrondissement.","Le <b>village</b> ou quartier de ville est dirigé par le chef de village (ou de quartier) et le conseil de village.","Ces autorités gèrent les affaires locales : état civil, marchés, propreté, écoles."],r:"Commune : maire. Arrondissement : chef d’arrondissement. Village : chef de village.",q:[["Qui dirige la commune ?",["Le maire","Le chef de village","Le député"],0],["Qui dirige le village ?",["Le chef de village","Le maire","Le ministre"],0],["L’arrondissement est dirigé par…",["Le chef d’arrondissement","Le roi","Le juge"],0]]},
"Institutions de l’État (1)":{l:["<b>Présidence de la République</b> : le Président dirige le pays et le gouvernement (pouvoir exécutif).","<b>Assemblée nationale</b> : les députés votent les lois. Le <b>Sénat</b> (chambre haute, installé en 2026) complète le Parlement.","<b>Justice</b> : tribunaux, cours d’appel, <b>Cour suprême</b> (plus haute juridiction pour les affaires judiciaires et administratives).","<b>Cour constitutionnelle</b> : vérifie que les lois respectent la Constitution et proclame les résultats des élections."],r:"Exécutif : Président. Législatif : Assemblée et Sénat. Judiciaire : tribunaux et Cour suprême.",q:[["Qui vote les lois ?",["L’Assemblée nationale","La Cour suprême","Le maire"],0],["Quelle institution vérifie la Constitution ?",["Cour constitutionnelle","HAAC","Le Sénat"],0],["Qui dirige le pays ?",["Le Président","Le chef de village","Le juge"],0]]},
